services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  airflow-init:
    build: .
    depends_on:
      - postgres
    env_file:
      - .env
    command: >
      bash -c "airflow db init && airflow users create --username ${AIRFLOW_ADMIN_USERNAME} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname User --role Admin --email ${AIRFLOW_ADMIN_EMAIL}"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs

  airflow-webserver:
    build: .
    restart: always
    depends_on:
      - postgres
      - airflow-init
    env_file:
      - .env
    ports:
      - "8081:8080"
    command: webserver
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs

  airflow-scheduler:
    build: .
    restart: always
    depends_on:
      - postgres
      - airflow-init
    env_file:
      - .env
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs

  fastapi:
    build: .
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/opt/airflow

volumes:
  pgdata: